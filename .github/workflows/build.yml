name: Tunnexa Build CI

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: tunnexa-ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# CI LABELS (explicit status contract)
#
#   SIMULATOR_TESTS_PASS
#       Reported by the parallel `simulator-tests` job. This is a code-quality
#       gate ONLY: the simulator-suitable unit suite (pure Swift, SOCKS5/YAML
#       protocol, hermetic DNS regression, injected engine lifecycle) passed
#       on an arm64 iOS Simulator. It is NOT proof that the VPN works:
#       packet-tunnel / NetworkExtension behavior cannot be validated on a
#       simulator and is verified on a physical iPhone only.
#
#   IPHONEOS_BUILD_PASS
#       Reported by the `build` job once the Release archive for the iPhoneOS
#       arm64 configuration (the target device is a physical iPhone 15 Pro)
#       has been produced.
#
#   IPA_VALIDATION_PASS
#       Reported by the `build` job once validate_ipa.py has confirmed the
#       archive contents: Tunnexa.app + embedded TunnexaPacketTunnel.appex,
#       bundle identifiers, NSExtension packet-tunnel metadata, arm64 device
#       binaries, App Group declaration, and entitlement state (embedded only
#       where signing permits).
# ---------------------------------------------------------------------------

jobs:
  # -------------------------------------------------------------------------
  # Code-quality gate. Runs in PARALLEL with the production build and never
  # blocks or slows it. Only the simulator-suitable test subset runs here.
  # -------------------------------------------------------------------------
  simulator-tests:
    name: Code Quality - Simulator Unit Tests (arm64)
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      sim_tests_pass: ${{ steps.labels.outputs.sim_tests_pass }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Regenerate Xcode Project
        run: python3 generate_project.py

      - name: Cache Swift Package Dependencies
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Tunnexa.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache DerivedData (test build reuse)
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-tests-${{ runner.os }}-${{ hashFiles('Tunnexa.xcodeproj/project.pbxproj') }}
          restore-keys: |
            deriveddata-tests-${{ runner.os }}-

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Tunnexa.xcodeproj \
            -scheme Tunnexa \
            -clonedSourcePackagesDirPath SourcePackages

      # PHASE 1/2: compile everything once. This is where most of the ~11 min
      # goes: Tun2SocksKit simulator slice (SPM C/C++ build) + app + packet
      # tunnel extension + test bundle. Split from execution so the build can
      # be cached (DerivedData) and so the two phases are timed separately.
      - name: "PHASE 1/2: Build for Testing"
        run: |
          START=$(date +%s)
          DEVICE_JSON=$(xcrun simctl list devices available -j)
          DEVICE_NAME=$(echo "$DEVICE_JSON" | python3 -c "import json,sys; data=json.load(sys.stdin); devices=[d['name'] for runtime in data['devices'].values() for d in runtime if d['isAvailable']]; print(devices[0] if devices else 'iPhone 16')")
          DEVICE_UDID=$(echo "$DEVICE_JSON" | python3 -c "import json,sys; data=json.load(sys.stdin); devices=[d['udid'] for runtime in data['devices'].values() for d in runtime if d['isAvailable']]; print(devices[0] if devices else '')")
          echo "Using simulator: $DEVICE_NAME ($DEVICE_UDID)"
          echo "DEVICE_NAME=$DEVICE_NAME" >> "$GITHUB_ENV"
          echo "DEVICE_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"
          xcodebuild build-for-testing \
            -project Tunnexa.xcodeproj \
            -scheme Tunnexa \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES
          END=$(date +%s)
          echo "PHASE_DURATION build_for_testing_seconds=$((END-START))"

      # Pre-boot the simulator and wait for bootstatus. `xcodebuild test` can
      # hang for tens of minutes on hosted runners when it boots a cold
      # simulator itself; booting first makes the test phase deterministic.
      - name: Pre-Boot Simulator
        run: |
          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

      # PHASE 2/2: run ONLY the simulator-suitable subset, in parallel across
      # worker processes (each worker is its own xctest process, so the
      # shared singletons in the app host are not racy between classes).
      #
      # Simulator-suitable groups (explicit -only-testing):
      #   - Pure Swift/unit: AutoReconnect, CredentialStore, EngineConfig,
      #     EnvironmentDetector, LogRedaction, Routing, StartupStateMachine,
      #     TunnelEngine (injected run closure / MockTunnelBackend),
      #     TunnelError, VPNManager (environment + error mapping)
      #   - SOCKS5/YAML/protocol: SOCKS5Protocol, LocalProxyServerLimits,
      #     YAMLParser
      #   - Host networking, hermetic only: ProxyEndpointResolver
      #     (RFC 2606 .invalid TLD -> guaranteed NXDOMAIN; no external service)
      #
      # Excluded by design (physical-device validation only):
      #   - NEPacketTunnelProvider / NEVPNManager behavior
      #   - Real networking (upstream proxy handshakes, tunneled traffic)
      - name: "PHASE 2/2: Run Unit Tests (simulator-suitable subset)"
        run: |
          START=$(date +%s)
          xcodebuild test-without-building \
            -project Tunnexa.xcodeproj \
            -scheme Tunnexa \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            -parallel-testing-enabled YES \
            -maximum-parallel-testing-workers 4 \
            -only-testing:TunnexaTests/AutoReconnectTests \
            -only-testing:TunnexaTests/CredentialStoreTests \
            -only-testing:TunnexaTests/EngineConfigTests \
            -only-testing:TunnexaTests/EnvironmentDetectorTests \
            -only-testing:TunnexaTests/LogRedactionTests \
            -only-testing:TunnexaTests/RoutingTests \
            -only-testing:TunnexaTests/StartupStateMachineTests \
            -only-testing:TunnexaTests/TunnelEngineTests \
            -only-testing:TunnexaTests/TunnelErrorTests \
            -only-testing:TunnexaTests/VPNManagerTests \
            -only-testing:TunnexaTests/YAMLParserTests \
            -only-testing:TunnexaTests/ProxyEndpointResolverTests \
            -only-testing:TunnexaTests/SOCKS5ProtocolTests \
            -only-testing:TunnexaTests/LocalProxyServerLimitsTests
          END=$(date +%s)
          echo "PHASE_DURATION test_execution_seconds=$((END-START))"

      - name: "CI LABEL: SIMULATOR_TESTS_PASS"
        id: labels
        run: |
          echo "sim_tests_pass=true" >> "$GITHUB_OUTPUT"
          {
            echo "## CI LABEL: SIMULATOR_TESTS_PASS"
            echo ""
            echo "The simulator-suitable unit suite passed on an arm64 iOS Simulator."
            echo ""
            echo "> **Code-quality gate only — NOT proof that the VPN works.**"
            echo "> Packet-tunnel / NetworkExtension behavior is validated on a physical"
            echo "> iPhone (target: iPhone 15 Pro) only. No simulator test exercises"
            echo "> NEPacketTunnelProvider, NEVPNManager, or real upstream proxies."
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'SIMULATOR_TESTS_PASS\n' > ci-labels.txt

      - name: Upload CI Labels Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-labels
          path: ci-labels.txt
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Production pipeline. Priority: the iPhoneOS arm64 Release archive with the
  # PacketTunnel extension embedded. Deliberately independent of the test job.
  # -------------------------------------------------------------------------
  build:
    name: Production - iPhoneOS arm64 Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          echo "Active Xcode:"
          xcodebuild -version
          echo "=== CI Environment Details ==="
          swift --version
          xcrun --sdk iphoneos --show-sdk-version || true
          echo "Build number: ${{ github.run_number }}"
          echo "Git commit: ${{ github.sha }}"

      - name: Regenerate Xcode Project
        run: |
          python3 generate_project.py

      - name: Verify Generator Determinism
        run: |
          python3 generate_project.py
          if git diff --exit-code -- Tunnexa.xcodeproj/project.pbxproj; then
            echo "Generator is deterministic — pbxproj unchanged after regeneration."
          else
            echo "ERROR: generate_project.py is NOT deterministic — pbxproj changed."
            exit 1
          fi

      - name: Update Bundle Version (CFBundleVersion)
        run: |
          echo "Setting CFBundleVersion to ${{ github.run_number }}..."
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Tunnexa/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" TunnexaPacketTunnel/Info.plist

      - name: Cache Swift Package Dependencies
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Tunnexa.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Tunnexa.xcodeproj \
            -scheme Tunnexa \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Clean & Build Archive (Unsigned, iPhoneOS arm64)
        run: |
          xcodebuild archive \
            -project Tunnexa.xcodeproj \
            -scheme Tunnexa \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Tunnexa.xcarchive \
            -clonedSourcePackagesDirPath SourcePackages \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SKIP_INSTALL=NO

      - name: "CI LABEL: IPHONEOS_BUILD_PASS"
        run: |
          echo "IPHONEOS_BUILD_PASS"
          echo "CI LABEL: IPHONEOS_BUILD_PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Package Unsigned IPA & ZIP
        run: |
          echo "Creating Unsigned IPA payload..."
          mkdir -p build/Payload
          cp -R build/Tunnexa.xcarchive/Products/Applications/Tunnexa.app build/Payload/
          cd build
          zip -r Tunnexa-unsigned-build-${{ github.run_number }}.ipa Payload
          zip -r Tunnexa-build-${{ github.run_number }}.zip Payload

          # Create build metadata
          echo "Build Number: ${{ github.run_number }}" > build-info.txt
          echo "Git Commit: ${{ github.sha }}" >> build-info.txt
          echo "Xcode Version: $(xcodebuild -version | head -1)" >> build-info.txt
          echo "SDK: iOS $(xcrun --sdk iphoneos --show-sdk-version || echo '26.6')" >> build-info.txt
          echo "Date: $(date)" >> build-info.txt
          echo "CI Labels: IPHONEOS_BUILD_PASS, IPA_VALIDATION_PASS (SIMULATOR_TESTS_PASS is reported by the parallel simulator-tests job and is NOT VPN validation)" >> build-info.txt

      - name: Validate IPA Packaging
        run: |
          python3 validate_ipa.py --app build/Tunnexa.xcarchive/Products/Applications/Tunnexa.app --expect-unsigned --json
          python3 validate_ipa.py --ipa build/Tunnexa-unsigned-build-${{ github.run_number }}.ipa --expect-unsigned --json

      - name: Verify Device Architectures (arm64 only)
        run: |
          APP=build/Tunnexa.xcarchive/Products/Applications/Tunnexa.app
          python3 - "$APP" <<'EOF'
          import json, subprocess, sys
          app = sys.argv[1]
          out = subprocess.run(
              ["python3", "validate_ipa.py", "--app", app, "--expect-unsigned", "--json"],
              capture_output=True, text=True, check=True
          ).stdout
          summary = json.loads(out[out.index("{"):])
          archs = summary["architectures"]["app"] + summary["architectures"]["extension"]
          if not archs:
              print("ERROR: could not determine architectures"); sys.exit(1)
          unexpected = [a for a in archs if a != "arm64"]
          if unexpected:
              print(f"ERROR: non-device architecture present: {unexpected}")
              sys.exit(1)
          print(f"OK: all binaries are arm64-only ({archs})")
          EOF

      - name: Verify Final Archive Contents
        run: |
          APP=build/Tunnexa.xcarchive/Products/Applications/Tunnexa.app
          python3 - "$APP" <<'EOF'
          import json, subprocess, sys
          app = sys.argv[1]
          out = subprocess.run(
              ["python3", "validate_ipa.py", "--app", app, "--expect-unsigned", "--json"],
              capture_output=True, text=True, check=True
          ).stdout
          s = json.loads(out[out.index("{"):])
          print("=== Final Archive Verification ===")
          print(f"  Tunnexa.app present:            {s['bundle_ids']['app'] == 'com.rakib.tunnexa'}")
          print(f"  TunnexaPacketTunnel.appex:      {'embedded' if s['extension_embedded'] else 'MISSING'}")
          print(f"  Extension bundle ID:            {s['bundle_ids']['extension']}")
          print(f"  NSExtensionPointIdentifier:     {s['extension_point']}")
          print(f"  NSExtensionPrincipalClass:      {s['principal_class']}")
          print(f"  App binaries:                   {', '.join(s['architectures']['app'])}")
          print(f"  Extension binaries:             {', '.join(s['architectures']['extension'])}")
          print(f"  Signing state:                  {'signed' if s['signing']['app_signed'] else 'unsigned'}")
          print(f"  Entitlements embedded:          {'yes' if s['entitlements']['embedded_in_archive'] else 'no (unsigned artifact — embedded at signing time)'}")
          print(f"  Source App Group declaration:   {s['entitlements']['source_application_groups']}")
          print(f"  Source NE entitlement:          {s['entitlements']['source_networkextension']}")
          checks = {
              "app_bundle_id": s["bundle_ids"]["app"] == "com.rakib.tunnexa",
              "extension_embedded": s["extension_embedded"],
              "extension_bundle_id": s["bundle_ids"]["extension"] == "com.rakib.tunnexa.PacketTunnel",
              "extension_point": s["extension_point"] == "com.apple.networkextension.packet-tunnel",
              "principal_class": bool(s["principal_class"]),
              "arm64_only": all(a == "arm64" for a in s["architectures"]["app"] + s["architectures"]["extension"]),
              "app_group_declared": "group.com.rakib.tunnexa" in s["entitlements"]["source_application_groups"],
          }
          failed = [k for k, v in checks.items() if not v]
          if failed:
              print(f"ERROR: archive verification failed: {failed}")
              sys.exit(1)
          print("OK: all archive content checks passed")
          EOF

      - name: "CI LABEL: IPA_VALIDATION_PASS"
        run: |
          echo "IPA_VALIDATION_PASS"
          echo "CI LABEL: IPA_VALIDATION_PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release on Push
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tunnexa Build ${{ github.run_number }}
          body: |
            ### Tunnexa Automated Release — Build #${{ github.run_number }}

            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Runner**: `macos-26`
            - **Xcode**: `26.6`
            - **Build Number**: `${{ github.run_number }}`
            - **Architecture**: iPhoneOS `arm64` only (target device: iPhone 15 Pro)

            #### CI Labels
            - `IPHONEOS_BUILD_PASS` — iPhoneOS arm64 Release archive built with the PacketTunnel extension embedded.
            - `IPA_VALIDATION_PASS` — structural archive/IPA validation passed (bundle IDs, embedded `TunnexaPacketTunnel.appex`, `NSExtensionPointIdentifier` = `com.apple.networkextension.packet-tunnel`, arm64-only binaries, App Group declaration).
            - `SIMULATOR_TESTS_PASS` — reported by the parallel **simulator-tests** job (see its run summary / `ci-labels` artifact). This is a **code-quality gate only and is NOT proof that the VPN works**: packet-tunnel/NetworkExtension behavior and real networking are validated on a physical iPhone only.

            #### Sideload Instructions
            This is an **unsigned** build. Honest capability notes:

            - **Standalone system-wide VPN (Mode A)**: an unsigned bundle **cannot**
              register the packet-tunnel provider. Sign the IPA with an Apple
              Developer certificate whose provisioning profile includes the
              `com.apple.developer.networking.networkextension` (packet-tunnel-provider)
              and `group.com.rakib.tunnexa` application-groups entitlements, or use a
              per-version-signing store (e.g. SideStore/AltStore). Without that, the
              VPN toggle will not appear.
            - **TrollStore**: can install the unsigned IPA, but system VPN
              registration is not guaranteed and requires the NetworkExtension
              entitlement at install time.
            - **LiveContainer in-app proxy (Mode C)**: install this IPA into
              LiveContainer; Tunnexa will detect the guest runtime and expose the
              local SOCKS5 proxy (127.0.0.1:10808) instead of attempting a system VPN.
            - Device-side behavior is reported by the app itself (Environment /
              Capabilities in Diagnostics); CI cannot test on a physical iPhone.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build/Tunnexa-unsigned-build-${{ github.run_number }}.ipa
            build/Tunnexa-build-${{ github.run_number }}.zip
            build/build-info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
