name: Tunnexa Build CI

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Tunnexa
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          echo "Active Xcode:"
          xcodebuild -version

      - name: Print CI Environment Details
        run: |
          echo "=== CI Environment Details ==="
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version || true
          echo "Build number: ${{ github.run_number }}"
          echo "Git commit: ${{ github.sha }}"

      - name: Regenerate Xcode Project
        run: |
          python3 generate_project.py

      - name: Update Bundle Version (CFBundleVersion)
        run: |
          echo "Setting CFBundleVersion to ${{ github.run_number }}..."
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Tunnexa/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" TunnexaPacketTunnel/Info.plist

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Tunnexa.xcodeproj \
            -scheme Tunnexa \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Clean & Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project Tunnexa.xcodeproj \
            -scheme Tunnexa \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Tunnexa.xcarchive \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SKIP_INSTALL=NO

      - name: Package Unsigned IPA & ZIP
        run: |
          echo "Creating Unsigned IPA payload..."
          mkdir -p build/Payload
          cp -R build/Tunnexa.xcarchive/Products/Applications/Tunnexa.app build/Payload/
          cd build
          zip -r Tunnexa-unsigned-build-${{ github.run_number }}.ipa Payload
          zip -r Tunnexa-build-${{ github.run_number }}.zip Payload

          # Create build metadata
          echo "Build Number: ${{ github.run_number }}" > build-info.txt
          echo "Git Commit: ${{ github.sha }}" >> build-info.txt
          echo "Xcode Version: $(xcodebuild -version | head -1)" >> build-info.txt
          echo "SDK: iOS $(xcrun --sdk iphoneos --show-sdk-version || echo '26.6')" >> build-info.txt
          echo "Date: $(date)" >> build-info.txt

      - name: Create GitHub Release on Push
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tunnexa Build ${{ github.run_number }}
          body: |
            ### Tunnexa Automated Release — Build #${{ github.run_number }}

            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Runner**: `macos-26`
            - **Xcode**: `26.6`
            - **Build Number**: `${{ github.run_number }}`

            #### Sideload Instructions
            This is an unsigned standalone iOS application bundle. You can sideload `Tunnexa-unsigned-build-${{ github.run_number }}.ipa` using TrollStore, AltStore, Sideloadly, or sign it with your Apple Developer certificate.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build/Tunnexa-unsigned-build-${{ github.run_number }}.ipa
            build/Tunnexa-build-${{ github.run_number }}.zip
            build/build-info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
